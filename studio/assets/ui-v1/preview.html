<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna Landing · UI asset preview</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#17371e;font-weight:700;background:#35523a;--cream:#fff5d6;--ink:#17371e;--green:#285b2d}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:4px solid #fff;box-shadow:0 0 0 7px #285b2d}button:disabled{opacity:.4;cursor:default}
.scene{height:100dvh;min-height:360px;background:#70825a url(preview-background.png) center/cover no-repeat;position:relative;overflow:hidden}
.preview-nav{position:absolute;top:18px;left:18px;display:flex;gap:6px;z-index:5}.preview-nav button{background:#fff5d6ee;border-radius:12px;padding:10px 14px;font-size:18px}.preview-nav button[aria-pressed=true]{background:var(--green);color:var(--cream)}
.coin{position:absolute;top:22px;right:28px;display:flex;align-items:center;gap:12px;padding:8px 22px 8px 12px;border-radius:26px;background:var(--cream);font-size:38px;box-shadow:0 4px 12px #2224}.coin .sprite{width:64px;height:64px}
.sprite{width:100%;height:100%;display:block;pointer-events:none}.world{position:absolute;left:18%;top:70%;background:var(--cream);border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:12px;font-size:28px;box-shadow:0 3px 8px #2223}.key{border:2px solid #d1b785;background:#f1e1b8;border-radius:8px;padding:2px 9px}
.hotbar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:3}.tool{position:relative;flex:0 0 88px;height:88px;background:var(--cream);border-radius:20px;padding:9px;box-shadow:0 4px 10px #2223}.tool.selected{outline:4px solid #426e36;outline-offset:4px;transform:translateY(-4px)}.tool:hover,.tile:hover{filter:brightness(1.025)}.count{position:absolute;right:0;bottom:0;border-radius:24px;background:var(--green);color:#fff9e8;font-size:27px;padding:0 7px;min-width:36px;line-height:36px;border:2px solid var(--cream)}.tool.empty .sprite{opacity:.30}
.popup{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:432px;max-height:calc(100% - 168px);padding:20px;background:var(--cream);border-radius:26px;box-shadow:0 8px 28px #1f321b30;z-index:2}.popup[hidden]{display:none}
.head{display:flex;align-items:center;gap:8px;margin-bottom:14px}.head .sprite{width:42px;height:42px}.head h1{font-size:34px;margin:0;flex:1;line-height:1.1}.glyph{width:42px;height:42px;background:transparent;border-radius:10px;padding:8px}.glyph svg{width:100%;height:100%;stroke:currentColor;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.pages{display:flex;align-items:center;gap:0}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{font-size:23px;flex:1;background:#f2e2bc;border-radius:12px;height:40px}.tabs button.active{background:var(--green);color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{height:108px;position:relative;border-radius:16px;background:#f5e8c5;border:2px solid #ead7aa;padding:7px 12px 26px}.tile .n{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:25px;line-height:29px}.tile.selected{border:3px solid var(--green);padding:6px 11px 25px}.tile.empty{border-style:dashed;background:transparent;cursor:default}.badge{position:absolute;right:3px;top:3px;width:25px;height:25px;display:grid;place-items:center;color:var(--ink);font-size:17px}.badge.Blue{background:#417cad;border-radius:6px;color:white}.badge.Silver{background:#b7c3ca;transform:rotate(45deg);border:2px solid #63757f}.badge.Silver span{transform:rotate(-45deg)}.badge.Gold{background:#dead43;border-radius:50%}
.transfer{margin-top:15px;padding-top:12px;border-top:2px solid #e9d7a9;display:flex;gap:8px;align-items:center}.transfer .sprite{width:45px;height:48px}.transfer .qty{font-size:28px;min-width:28px}.action{height:48px;font-size:24px;padding:0 16px;border-radius:13px;background:var(--green);color:var(--cream);flex:1}.amount-button{background:#f0dfb6;color:var(--ink);padding:0 12px;font-size:22px;flex:0}.focus-label{height:28px;margin:8px 0 -2px;font-size:23px;text-align:center}
.amount-editor{position:absolute;inset:0;border-radius:26px;background:var(--cream);padding:22px;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center}.amount-editor[hidden]{display:none}.amount-editor h2{font-size:34px;margin:0}.amount-editor .controls{display:flex;justify-content:center;align-items:center;gap:20px}.amount-editor .controls button{background:#f0dfb6;border-radius:12px;width:54px;height:54px;font-size:32px}.amount-editor output{font-size:36px;min-width:74px}.amount-editor .buttons{display:flex;gap:10px}.toast{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 20px;border-radius:16px;background:var(--cream);font-size:28px;box-shadow:0 5px 18px #2233;z-index:6}.toast[hidden]{display:none}.toast .sprite{width:46px;height:46px}
.audit{position:absolute;inset:88px 24px 24px;background:var(--cream);border-radius:24px;padding:20px;overflow:auto;z-index:8}.audit[hidden]{display:none}.audit h2{font-size:28px;margin:0 0 16px}.audit-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}.audit figure{margin:0;display:flex;flex-direction:column;align-items:center;background:#f3e5c0;border-radius:14px;padding:10px}.audit .sprite{width:80px;height:86px}.audit figcaption{font-size:18px;text-align:center;margin-top:8px}.audit-note{font-size:19px;margin:0 0 18px}
@media(min-width:1600px){.popup{right:5%;width:484px;padding:24px}.grid{gap:12px}.tile{height:124px;padding-bottom:30px}.tile.selected{padding-bottom:29px}.tile .n{font-size:29px;line-height:32px}.hotbar{gap:16px}.tool{flex-basis:96px;height:96px}.head h1{font-size:38px}.transfer{gap:10px}}
@media(max-height:620px) and (min-width:650px){.coin{left:18px;right:auto;top:62px;font-size:30px;padding:5px 14px}.coin .sprite{width:46px;height:46px}.popup{right:14px;top:12px;transform:none;width:340px;max-height:calc(100% - 24px);padding:12px;border-radius:20px}.head{margin-bottom:8px;gap:2px}.head h1{font-size:30px}.head .sprite{width:32px;height:36px}.glyph{width:40px;height:40px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.tile{height:86px;padding:4px 18px 24px}.tile.selected{padding:3px 17px 23px}.tile .n{font-size:24px;line-height:27px}.transfer{margin-top:8px;padding-top:8px;gap:6px}.transfer .sprite{width:34px;height:40px}.transfer .qty{font-size:25px}.action{height:44px;padding:0 10px;font-size:22px}.amount-button{font-size:22px}.hotbar{left:14px;transform:none;bottom:14px;gap:7px}.tool{flex-basis:64px;height:64px;border-radius:15px;padding:6px}.count{font-size:22px;line-height:28px;min-width:29px;padding:0 4px}.preview-nav{top:12px;left:14px}.preview-nav button{font-size:16px;padding:8px 10px}.world{left:13%;top:60%;font-size:24px}.toast{left:180px;bottom:95px}.tabs{margin-bottom:8px}.tabs button{height:36px;font-size:22px}.focus-label{font-size:22px;height:25px;margin-top:4px}.audit-grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:649px){.coin{right:14px;top:70px;font-size:29px;padding:5px 14px}.coin .sprite{width:44px;height:44px}.popup{width:calc(100% - 28px);right:14px;top:45%;max-height:calc(100% - 190px);padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.tile{height:98px}.hotbar{gap:7px;bottom:22px}.tool{flex-basis:62px;height:66px;padding:6px;border-radius:14px}.count{font-size:22px;line-height:27px;min-width:29px}.head h1{font-size:30px}.head .sprite{width:34px;height:34px}.transfer .sprite{width:34px}.action{font-size:22px;padding:0 10px}.transfer .qty{font-size:25px}.amount-button{font-size:22px}.world{left:18px;top:auto;bottom:115px;font-size:24px}.toast{bottom:105px}.audit-grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:no-preference){.tool{transition:transform .12s ease,outline .1s}.tile{transition:background .1s}}
</style></head><body>
<main class="scene" aria-label="Interactive UI prototype with sample inventory; separate from the live game">
<nav class="preview-nav" aria-label="Preview states"><button data-view="chest">Chest</button><button data-view="bag">Bag</button><button data-view="seeds">Seeds</button><button data-view="icons">Icons</button></nav>
<div class="coin" aria-label="248 Sterne"><span data-icon="sterne"></span><span>248</span></div>
<button class="world" id="open-chest"><span class="key">E</span>Chest</button>
<section class="popup" id="popup" aria-label="Chest inventory"><header class="head"><span id="heading-icon"></span><h1 id="heading">Chest</h1><div class="pages"><button class="glyph" id="previous" aria-label="Previous page"></button><button class="glyph" id="next" aria-label="Next page"></button></div><button class="glyph" id="close" aria-label="Close"></button></header><nav class="tabs" id="tabs" hidden><button data-category="Seed">Seeds</button><button data-category="Produce">Produce</button><button data-category="Utility">Tools</button></nav><div class="grid" id="grid"></div><div class="focus-label" id="focus-label" aria-live="polite"></div><div class="transfer" id="transfer"><span id="transfer-icon"></span><span class="qty" id="quantity"></span><button class="action amount-button" id="amount">Amount</button><button class="action" id="act">Store</button></div><section class="amount-editor" id="amount-editor" hidden aria-label="Choose quantity"><h2>Amount</h2><div class="controls"><button id="minus" aria-label="One less">−</button><output id="amount-value">12</output><button id="plus" aria-label="One more">+</button></div><div class="buttons"><button class="action amount-button" id="amount-cancel">Cancel</button><button class="action amount-button" id="all">All</button><button class="action" id="done">Done</button></div></section></section>
<nav class="hotbar" id="hotbar" aria-label="Carried tools and selected item"></nav><div class="toast" id="toast" hidden role="status"></div>
<section class="audit" id="audit" hidden><h2>24 reusable icons</h2><p class="audit-note">Transparent artwork shown on cream. Counts, labels, controls, and quality badges stay separate.</p><div class="audit-grid" id="audit-grid"></div></section>
</main><script src="preview-data.js"></script><script>
"use strict";
const A=window.LunaUIAssets, el=id=>document.getElementById(id);
const paths={close:'M7 7L25 25M25 7L7 25',left:'M21 5L10 16L21 27',right:'M11 5L22 16L11 27'};
function glyph(name){return `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${paths[name]}"/></svg>`}
function icon(id){const s=A.sprites[id];if(!s)throw Error('Unknown icon '+id);const [x,y,w,h]=s.rect;return `<svg class="sprite" viewBox="${x} ${y} ${w} ${h}" role="img" aria-label="${s.label}"><image href="items-atlas.png" width="1024" height="1536"/></svg>`}
function badge(q){return q&&q!=='Common'?`<span class="badge ${q}" aria-label="${q}"><span>${q==='Blue'?'•':q==='Gold'?'W':'='}</span></span>`:''}
const carried={shovel:1,watering_can:1,pepper_seeds:12,carrot_seeds:6,lettuce_seeds:8,pumpkin_seeds:4,grape_seeds:4,corn_seeds:4,wheat_seeds:5,potato_seeds:2,fertilizer_bag:8,'pepper_harvest:Gold':5,'lettuce_harvest:Common':3};
const chest={'grape_harvest:Silver':6,'pumpkin_harvest:Common':3,carrot_seeds:9,'potato_harvest:Common':8};
const totals=()=>{const out={};for(const map of [carried,chest])for(const [k,n] of Object.entries(map))out[k]=(out[k]||0)+n;return out};const initialTotals=totals();
let mode='chest',category='Seed',page=0,selection={source:'carried',key:'pepper_seeds'},held='pepper_seeds',rememberedSeed='pepper_seeds',quantity=null,edited=1,notice;
const split=key=>key.split(':'), idOf=key=>split(key)[0], getMap=source=>source==='chest'?chest:carried;
const pageSize=()=>innerWidth<650||(innerHeight<=620&&innerWidth>=650)?4:6;
function selectedCount(){return selection?(getMap(selection.source)[selection.key]||0):0}
function selectedAmount(){return quantity===null?selectedCount():Math.min(quantity,selectedCount())}
function announce(id,text){clearTimeout(notice);el('toast').innerHTML=icon(id)+`<span>${text}</span>`;el('toast').hidden=false;notice=setTimeout(()=>el('toast').hidden=true,1600)}
function setMode(next){mode=next;page=0;quantity=null;el('amount-editor').hidden=true;el('audit').hidden=next!=='icons';el('popup').hidden=next==='icons'||next==='closed';render()}
function select(source,key){selection={source,key};quantity=null;render();}
function render(){
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===mode));
 const all=[['shovel','Shovel'],['watering_can','Watering Can'],[held&&!['shovel','watering_can','fertilizer_bag'].includes(idOf(held))?held:rememberedSeed,'Selected item'],['fertilizer_bag','Fertilizer'],['bag','Bag']];
 el('hotbar').innerHTML=all.map(([key,label])=>{const id=idOf(key),n=carried[key]||0;return `<button class="tool ${held===key?'selected':''} ${!n&&id!=='bag'?'empty':''}" data-key="${key}" aria-label="${id==='bag'?'Bag':A.sprites[id].label+' '+n}" title="${A.sprites[id].label}">${icon(id)}${n>0&&!['bag','shovel','watering_can'].includes(id)?`<span class="count">${n}</span>`:''}${badge(split(key)[1])}</button>`}).join('');
 el('hotbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{const key=b.dataset.key;if(key==='bag'){category='Seed';setMode('bag');return}if(!carried[key]){announce(idOf(key),'In Chest');return}const same=held===key;held=key;selection={source:'carried',key};quantity=null;if(mode!=='chest'&&same&&idOf(key).endsWith('_seeds'))setMode('seeds');else render()});
 if(['icons','closed'].includes(mode))return;
 const isChest=mode==='chest';el('heading').textContent=isChest?'Chest':mode==='seeds'?'Seeds':'Bag';el('heading-icon').innerHTML=icon(isChest?'chest_open':mode==='seeds'?rememberedSeed:'bag');
 el('tabs').hidden=mode!=='bag';document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));
 const source=isChest?'chest':'carried',inventory=getMap(source);
 const entries=Object.keys(inventory).filter(k=>inventory[k]>0&&(isChest||(mode==='seeds'?A.sprites[idOf(k)].kind==='Seed':A.sprites[idOf(k)].kind===category)));
 const ps=pageSize(),pages=Math.max(1,Math.ceil(entries.length/ps));page=Math.min(page,pages-1);el('previous').disabled=page===0;el('next').disabled=page===pages-1;
 const visible=entries.slice(page*ps,(page+1)*ps);while(visible.length<ps)visible.push(null);
 el('grid').innerHTML=visible.map(key=>key?`<button class="tile ${selection?.source===source&&selection.key===key?'selected':''}" data-key="${key}" aria-label="${A.sprites[idOf(key)].label} ${split(key)[1]||''} ${inventory[key]}">${icon(idOf(key))}${badge(split(key)[1])}<span class="n">${inventory[key]}</span></button>`:'<div class="tile empty" aria-label="Empty slot"></div>').join('');
 el('grid').querySelectorAll('button').forEach(b=>{b.onmouseenter=()=>el('focus-label').textContent=A.sprites[idOf(b.dataset.key)].label;b.onfocus=b.onmouseenter;b.onclick=()=>{select(source,b.dataset.key);if(mode==='seeds'){held=b.dataset.key;rememberedSeed=held;announce(idOf(held),A.sprites[idOf(held)].label);setMode('closed')}}});
 const n=selectedCount(),key=selection?.key;el('transfer-icon').innerHTML=key?icon(idOf(key)):'';el('quantity').textContent=selectedAmount()||0;el('focus-label').textContent=key?A.sprites[idOf(key)].label:'';
 el('act').textContent=isChest?(selection?.source==='chest'?'Take':'Store'):'Hold';el('act').disabled=!n;el('amount').hidden=!isChest;el('amount').disabled=n<=1;el('transfer').hidden=mode==='seeds';
}
function move(){if(!selection)return;const {source,key}=selection,n=selectedAmount();if(!Number.isInteger(n)||n<1)return;if(mode==='chest'){const from=getMap(source),to=source==='chest'?carried:chest;if((from[key]||0)<n)return;from[key]-=n;to[key]=(to[key]||0)+n;if(source==='chest'){held=key;if(idOf(key).endsWith('_seeds'))rememberedSeed=key;}if(!carried[held])held=null;quantity=null;const now=totals();for(const [k,total] of Object.entries(initialTotals))if(now[k]!==total)throw Error('Inventory conservation failure: '+k);announce(idOf(key),source==='chest'?'Taken':'Stored');}else{held=key;if(idOf(key).endsWith('_seeds'))rememberedSeed=key;announce(idOf(key),'Held');}render()}
el('act').onclick=move;el('amount').onclick=()=>{edited=selectedAmount();el('amount-editor').hidden=false;renderAmount()};function renderAmount(){el('amount-value').textContent=edited;el('minus').disabled=edited<=1;el('plus').disabled=edited>=selectedCount()}
el('minus').onclick=()=>{edited=Math.max(1,edited-1);renderAmount()};el('plus').onclick=()=>{edited=Math.min(selectedCount(),edited+1);renderAmount()};el('all').onclick=()=>{edited=selectedCount();renderAmount()};el('done').onclick=()=>{quantity=edited;el('amount-editor').hidden=true;render()};el('amount-cancel').onclick=()=>el('amount-editor').hidden=true;
el('previous').innerHTML=glyph('left');el('next').innerHTML=glyph('right');el('close').innerHTML=glyph('close');el('previous').onclick=()=>{page--;render()};el('next').onclick=()=>{page++;render()};el('close').onclick=()=>setMode('closed');el('open-chest').onclick=()=>setMode('chest');
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setMode(b.dataset.view));document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;page=0;render()});document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));
el('audit-grid').innerHTML=Object.entries(A.sprites).map(([id,s])=>`<figure>${icon(id)}<figcaption>${s.label}${s.kind==='Seed'?' seeds':''}</figcaption></figure>`).join('');
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='Escape'){el('amount-editor').hidden?setMode('closed'):el('amount-editor').hidden=true;}if(e.key.toLowerCase()==='e'&&mode==='closed')setMode('chest');if(e.key.toLowerCase()==='i')setMode(mode==='bag'?'closed':'bag')});window.addEventListener('resize',()=>render());render();
</script></body></html>
